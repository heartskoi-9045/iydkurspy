
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모르면 간첩</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, "Apple SD Gothic Neo", sans-serif;
}

/* 첫 번째 화면 */
#screen1 {
  width: 100%;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

#screen1 img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#clickArea {
  position: absolute;
  left: 39%;
  top: 15%;
  width: 24%;
  height: 58%;
}

/* 두 번째 화면 */
#screen2 {
  display: none;
  min-height: 100vh;
  padding: 5.5% 5.2%;
  background: #000;
}

#message {
  font-size: clamp(14px, 1.85vw, 30px);
  font-weight: 500;
  line-height: 1.48;
  letter-spacing: 0.01em;
  white-space: pre-wrap;
}

.pink {
  color: #f02cdb;
}

.white {
  color: #fff;
  text-decoration: line-through;
  text-decoration-color: #fff;
  text-decoration-thickness: 1.5px;
}

.white2 {
  color: #fff;
}

.cursor {
  display: inline-block;
  width: 0.5em;
  height: 1em;
  background: #f02cdb;
  vertical-align: -0.12em;
  animation: blink 0.7s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* 세 번째 화면 */
#screen3 {
  display: none;
  min-height: 100vh;
  background: #f345ed;
}

/* 전체 배경 이미지와 클릭 영역 */
#backgroundWrap {
  position: relative;
  width: 100%;
  max-width: none;
  margin: 0;
}

#backgroundImage {
  display: block;
  width: 100%;
  height: auto;
}

/* 도형별 투명 클릭 영역 */
.pieceButton {
  position: absolute;
  display: block;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: 10%;
}

/* 팝업 배경 */
#popupOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9990;
  background: rgba(0, 0, 0, 0.6);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* 팝업 이미지 */
#popupImage {
  display: block;
  max-width: 95vw;
  max-height: 90vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

body.popupOpen {
  overflow: hidden !important;
}

/* 커스텀 마우스 커서 */
#customCursor {
  position: fixed;
  width: 128px;
  height: 36px;
  left: 0;
  top: 0;
  background: url("./point.png") center / contain no-repeat;
  pointer-events: none;
  z-index: 999999;
  transform: translate(-50%, -50%);
  visibility: hidden;
  will-change: left, top;
}

/* JavaScript가 준비된 후 기본 커서 숨김 */
@media (pointer: fine) {
  html.cursor-ready,
  html.cursor-ready body,
  html.cursor-ready body * {
    cursor: none !important;
  }
}
</style>
</head>

<body>

<!-- 커스텀 커서 -->
<div id="customCursor"></div>

<!-- 첫 번째 화면 -->
<div id="screen1">
  <img src="main.jpg" alt="모르면 간첩">
  <div id="clickArea" onclick="startTyping()"></div>
</div>

<!-- 두 번째 화면 -->
<div id="screen2">
  <div id="message"></div>
</div>

<!-- 세 번째 화면 -->
<div id="screen3">
  <div id="backgroundWrap">
    <img
      id="backgroundImage"
      src="background.jpg"
      alt="한국인으로서의 당신을 만들어줄 조각들"
    >
    <div id="pieceButtons"></div>
  </div>
</div>

<!-- 팝업 -->
<div id="popupOverlay" onclick="closePopup()">
  <img id="popupImage" alt="추억 정보">
</div>

<script>

/* =========================
   두 번째 페이지 타자기
========================= */

const messages = [
  { text: "요원님, 좋은 아침입니다.\n\n", color: "pink" },

  { text: "대한민국(Republic of Korea)에 잠입할 준비는 잘 하고 계신가요?\n", color: "pink" },

  { text: "당신의 신분은 완벽히 준비해두었습니다.\n", color: "pink" },

  { text: "김민지 (2004.12.25), 서울, 대한민국\n\n", color: "white2" },

  { text: "한국어와 기본적인 문화는 익히셨으리라 생각합니다.\n", color: "pink" },

  { text: "단, 당신에게는 한국에서 살아온 기억이 없습니다.\n", color: "pink" },

  { text: "한국에서는, 모두가 알 만한 것을 모르는 사람을 쉽게 ‘간첩’으로 몰아가곤 합니다.\n", color: "white" },

  { text: "절대 우리의 정체를 들키지 마세요.\n\n\n", color: "white" },

  { text: "*\n", color: "pink" },

  { text: "한국인과 대화해도 의심받지 않도록, 완벽한 위장을 준비하세요.", color: "pink" }
];

let started = false;
let typingFinished = false;

function startTyping() {
  if (started) return;
  started = true;

  document.getElementById("screen1").style.display = "none";
  document.getElementById("screen2").style.display = "block";

  typeMessages();
}

async function typeMessages() {
  const container = document.getElementById("message");

  const cursor = document.createElement("span");
  cursor.className = "cursor";

  for (const message of messages) {
    const span = document.createElement("span");
    span.className = message.color;

    container.appendChild(span);
    container.appendChild(cursor);

    for (const char of message.text) {
      span.textContent += char;

      await new Promise(resolve =>
        setTimeout(resolve, char === "\n" ? 180 : 42)
      );
    }

    await new Promise(resolve =>
      setTimeout(resolve, 250)
    );
  }

  cursor.remove();
  typingFinished = true;
}

/* =========================
   두 번째 → 세 번째 페이지
========================= */

document.getElementById("screen2").addEventListener("click", function() {
  if (!typingFinished) return;

  document.getElementById("screen2").style.display = "none";
  document.getElementById("screen3").style.display = "block";

  document.body.style.overflow = "auto";
  window.scrollTo(0, 0);
});

/* =========================
   18개 도형 클릭 영역
   좌표 기준: 735 × 2048
========================= */

/*
 x, y = 도형의 왼쪽 위 좌표
 w, h = 클릭 영역의 너비와 높이
*/

const pieces = [
  { x: 239, y: 191, w: 162, h: 114 },
  { x: 575, y: 136, w: 114, h: 203 },
  { x: 37,  y: 268, w: 209, h: 221 },
  { x: 394, y: 377, w: 269, h: 202 },
  { x: 62,  y: 628, w: 138, h: 231 },
  { x: 315, y: 574, w: 346, h: 190 },
  { x: 215, y: 794, w: 155, h: 195 },
  { x: 422, y: 851, w: 220, h: 152 },
  { x: 79,  y: 951, w: 125, h: 146 },
  { x: 270, y: 1099,w: 192, h: 141 },
  { x: 529, y: 1031,w: 148, h: 173 },
  { x: 34,  y: 1164,w: 195, h: 246 },
  { x: 277, y: 1293,w: 136, h: 231 },
  { x: 531, y: 1306,w: 91,  h: 88 },
  { x: 162, y: 1570,w: 112, h: 130 },
  { x: 399, y: 1518,w: 244, h: 177 },
  { x: 102, y: 1818,w: 128, h: 97 },
  { x: 375, y: 1759,w: 149, h: 131 }
];

/* 투명 클릭 영역 생성 */
function createPieceButtons() {
  const container = document.getElementById("pieceButtons");

  pieces.forEach((piece, index) => {
    const button = document.createElement("button");

    button.className = "pieceButton";
    button.type = "button";
    button.setAttribute("aria-label", "추억의 조각 " + (index + 1));

    button.style.left = (piece.x / 735 * 100) + "%";
    button.style.top = (piece.y / 2048 * 100) + "%";
    button.style.width = (piece.w / 735 * 100) + "%";
    button.style.height = (piece.h / 2048 * 100) + "%";

    button.addEventListener("click", function(e) {
      e.stopPropagation();
      openPopup("piece" + (index + 1) + ".jpg");
    });

    container.appendChild(button);
  });
}

createPieceButtons();

/* =========================
   팝업 열기 / 닫기
========================= */

function openPopup(imageName) {
  const overlay = document.getElementById("popupOverlay");
  const image = document.getElementById("popupImage");

  image.src = imageName;
  overlay.style.display = "flex";
  document.body.classList.add("popupOpen");
}

function closePopup() {
  document.getElementById("popupOverlay").style.display = "none";
  document.body.classList.remove("popupOpen");
}

document.getElementById("popupImage").addEventListener("click", function(e) {
  e.stopPropagation();
});

/* ESC 키로 팝업 닫기 */
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") closePopup();
});

/* =========================
   커스텀 마우스 커서
========================= */

const customCursor = document.getElementById("customCursor");

const cursorImage = new Image();
cursorImage.src = "./point.png";

cursorImage.onload = function() {
  document.documentElement.classList.add("cursor-ready");
};

cursorImage.onerror = function() {
  console.warn("point.png 파일을 불러올 수 없습니다.");
};

window.addEventListener("pointermove", function(e) {
  if (e.pointerType === "touch") return;

  customCursor.style.left = e.clientX + "px";
  customCursor.style.top = e.clientY + "px";
  customCursor.style.visibility = "visible";
});

document.addEventListener("mouseout", function(e) {
  if (!e.relatedTarget) {
    customCursor.style.visibility = "hidden";
  }
});

window.addEventListener("blur", function() {
  customCursor.style.visibility = "hidden";
});

</script>

</body>
</html>
