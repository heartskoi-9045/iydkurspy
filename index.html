
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모르면 간첩</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, "Apple SD Gothic Neo", sans-serif;
}

/* 첫 번째 화면 */
#screen1 {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

#screen1 img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* 이미지 중앙 클릭 영역 */
#clickArea {
  position: absolute;
  left: 39%;
  top: 15%;
  width: 24%;
  height: 58%;
  cursor: pointer;
}

/* 두 번째 화면 */
#screen2 {
  display: none;
  min-height: 100vh;
  padding: 5.5% 5.2%;
  background: #000;
}

#message {
  font-size: clamp(14px, 1.85vw, 30px);
  font-weight: 500;
  line-height: 1.48;
  letter-spacing: 0.01em;
  white-space: pre-wrap;
}

.pink {
  color: #f02cdb;
}


.white {
  color: #ffffff;
  text-decoration: line-through;
  text-decoration-color: #ffffff;
  text-decoration-thickness: 1.5px;
}

  .white2 {
  color: #ffffff;
  }
  
.cursor {
  display: inline-block;
  width: 0.5em;
  height: 1em;
  background: #f02cdb;
  vertical-align: -0.12em;
  animation: blink 0.7s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
  

/* 기본 커서 숨기기 */
html, body, * {
  cursor: none !important;
}


/* 이미지 커서 */
#customCursor {
  position: fixed;
  width: 128px;
  height: 36px;
  background-image: url("./point.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 128px 36px;
  pointer-events: none;
  z-index: 999999;
  left: 0;
  top: 0;
  display: block;
  transform: translate(-50%, -50%);
}

  
/* 세 번째 페이지 */
#screen3 {
  display: none;
  background: #f345ed;
  min-height: 100vh;
  color: #000;
}

/* 상단 안내문 */
#screen3Header {
  padding: 45px 5.5% 10px;
  font-size: clamp(13px, 1.5vw, 22px);
  font-weight: bold;
  line-height: 1.5;
}

/* 도형이 배치되는 공간 */
#shapeContainer {
  position: relative;
  width: 100%;
  min-height: 1800px;
  overflow: hidden;
}

/* 각각의 도형 */
.randomShape {
  position: absolute;
  width: 18%;
  height: auto;
  cursor: none;
  transition: transform 0.2s ease;
}

.randomShape:hover {
  transform: scale(1.08);
}

/* 팝업 배경 */
#popupOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 9990;
  align-items: center;
  justify-content: center;
}

/* 팝업 이미지 */
#popupImage {
  max-width: 90vw;
  max-height: 85vh;
  object-fit: contain;
}

body.popupOpen {
  overflow: hidden;
}


</style>
</head>

<body>

  <div id="customCursor"></div>
  
<!-- 첫 번째 화면 -->
<div id="screen1">
  <img src="main.jpg" alt="모르면 간첩">
  <div id="clickArea" onclick="startTyping()"></div>
</div>

<!-- 두 번째 화면 -->
<div id="screen2">
  <div id="message"></div>
</div>

  <!-- 세 번째 페이지 -->
<div id="screen3">

  <div id="screen3Header">
    한국인으로서의 당신을 만들어줄 조각들입니다.<br>
    조각 안에는 당신의 신분에 맞춘 가짜 추억들도 준비했습니다.<br>
    클릭해보세요.
  </div>

  <div id="shapeContainer"></div>

</div>

<!-- 팝업 -->
<div id="popupOverlay" onclick="closePopup()">
  <img id="popupImage" alt="추억 정보">
</div>
  
<script>
const messages = [
  { text: "요원님, 좋은 아침입니다.\n\n", color: "pink" },

  { text: "대한민국(Republic of Korea)에 파견될 준비는 잘 하고 계신가요?\n", color: "pink" },

  { text: "당신의 수준이라면 이미 한국어는 원어민과 같이 구사할 수 있을 거라 믿습니다.\n", color: "pink" },

  { text: "이제부터는 완전히 한국인으로 위장하기 위한 정보를 습득할 시간입니다.\n", color: "pink" },

  { text: "한국에서는, 모두가 알 만한 것을 모르는 사람을 쉽게 ‘간첩’으로 몰아가곤 합니다.\n", color: "white" },

  { text: "절대 우리의 정체를 들키지 마세요.\n\n\n", color: "white" },

  { text: "*\n", color: "pink" },

  { text: "아, 가장 기본이지만 신분 설정은 가장 중요하니 다시 한 번 확인하세요.\n\n", color: "pink" },

  { text: "김민지 (2004.12.25), 서울\n\n", color: "white2" },

  { text: "한국의 크리스마스는 공휴일이랍니다.", color: "pink" }
];

let started = false;
  let typingFinished = false;

function startTyping() {
  if (started) return;
  started = true;

  document.getElementById("screen1").style.display = "none";
  document.getElementById("screen2").style.display = "block";

  typeMessages();
}

async function typeMessages() {
  const container = document.getElementById("message");

  const cursor = document.createElement("span");
  cursor.className = "cursor";

  for (const message of messages) {
    const span = document.createElement("span");
    span.className = message.color;
    container.appendChild(span);
    container.appendChild(cursor);

    for (const char of message.text) {
      span.textContent += char;

      await new Promise(resolve =>
        setTimeout(resolve, char === "\n" ? 180 : 42)
      );
    }

    await new Promise(resolve => setTimeout(resolve, 250));
  }

  
    cursor.remove();
  typingFinished = true;
}
}


/* 마우스 커서 따라다니기 */
const customCursor = document.getElementById("customCursor");

window.addEventListener("pointermove", function(e) {
  customCursor.style.left = e.clientX + "px";
  customCursor.style.top = e.clientY + "px";
});

/* 웹사이트에 마우스가 들어오면 표시 */
document.addEventListener("pointerenter", function() {
  customCursor.style.visibility = "visible";
});

/* 웹사이트에서 마우스가 나가면 숨기기 */
document.addEventListener("pointerleave", function() {
  customCursor.style.visibility = "hidden";
});


/* 도형과 연결된 팝업 이미지 */
const shapeData = [
  { shape: "shape1.png", popup: "choco.png" },
  { shape: "shape2.png", popup: "memory2.png" },
  { shape: "shape3.png", popup: "memory3.png" },
  { shape: "shape4.png", popup: "memory4.png" }
];

/* 두 번째 페이지에서 세 번째 페이지로 */
document.getElementById("screen2").addEventListener("click", function() {
  if (!typingFinished) return;

  document.getElementById("screen2").style.display = "none";
  document.getElementById("screen3").style.display = "block";

  document.body.style.overflow = "auto";
  window.scrollTo(0, 0);

  createRandomShapes();
});

/* 랜덤 도형 생성 */
function createRandomShapes() {
  const container = document.getElementById("shapeContainer");
  container.innerHTML = "";

  const columns = 3;
  const rows = Math.ceil(shapeData.length / columns);
  const cellHeight = 320;

  container.style.minHeight = Math.max(1500, rows * cellHeight + 200) + "px";

  const positions = [];

  for (let i = 0; i < shapeData.length; i++) {
    const col = i % columns;
    const row = Math.floor(i / columns);

    positions.push({
      x: col * (100 / columns) + Math.random() * 10,
      y: row * cellHeight + Math.random() * 120
    });
  }

  /* 배치 순서 섞기 */
  positions.sort(() => Math.random() - 0.5);

  shapeData.forEach((data, index) => {
    const img = document.createElement("img");

    img.src = data.shape;
    img.className = "randomShape";
    img.alt = "추억의 조각 " + (index + 1);

    img.style.left = positions[index].x + "%";
    img.style.top = positions[index].y + "px";

    img.addEventListener("click", function() {
      openPopup(data.popup);
    });

    container.appendChild(img);
  });
}

/* 팝업 열기 */
function openPopup(imageName) {
  document.getElementById("popupImage").src = imageName;
  document.getElementById("popupOverlay").style.display = "flex";
  document.body.classList.add("popupOpen");
}

/* 팝업 닫기 */
function closePopup() {
  document.getElementById("popupOverlay").style.display = "none";
  document.body.classList.remove("popupOpen");
}

/* 이미지 클릭 시 팝업 유지 */
document.getElementById("popupImage").addEventListener("click", function(e) {
  e.stopPropagation();
});

  
</script>

</script>

</body>
</html>
